    <script>
      const slide = document.querySelector(".figma-slide");
      function resizeDeck() {
        const w = Number.parseFloat(slide.style.width) || 1920;
        const h = Number.parseFloat(slide.style.height) || 1080;
        const scale = Math.min(window.innerWidth / w, window.innerHeight / h);
        document.documentElement.style.setProperty("--deck-scale", String(scale));
        document.documentElement.style.setProperty("--deck-width", w + "px");
        document.documentElement.style.setProperty("--deck-height", h + "px");
      }
      window.addEventListener("resize", resizeDeck);
      resizeDeck();
    </script>
