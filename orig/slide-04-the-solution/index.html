    <script>
      const slide = document.querySelector(".figma-slide");
      function resizeDeck() {
        const w = Number.parseFloat(slide.style.width) || 1920;
        const h = Number.parseFloat(slide.style.height) || 1080;
        const scale = Math.min(window.innerWidth / w, window.innerHeight / h);
        document.documentElement.style.setProperty("--deck-scale", String(scale));
        document.documentElement.style.setProperty("--deck-width", w + "px");
        document.documentElement.style.setProperty("--deck-height", h + "px");
      }
      window.addEventListener("resize", resizeDeck);
      resizeDeck();
    </script>
      <script src="../_frankly-anim.js"></script>
      <script>
        /* Customer counter: rolls up 0 → 32.000 on slide enter, then keeps
           ticking up slowly (a few new customers every couple of seconds) so it
           feels live while the slide is on screen. Replays on enter, resets on
           leave. Honors reduced-motion / still. */
        (function () {
          var el = document.getElementById('custCount');
          if (!el) return;
          var BASE = parseInt(el.getAttribute('data-target'), 10) || 32000;
          var STILL = /still/i.test(location.hash) || /(?:^|[?&])still(?:=|&|$)/i.test(location.search);
          var REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
          var fmt = function (n) { return Math.round(n).toLocaleString('da-DK'); };
          el.style.display = 'inline-block';
          el.style.transformOrigin = 'center bottom';
          var rollRaf = null, tickTimer = null, popTimer = null, live = BASE;
          // Small spring-pop: scale up then settle, for the finish and each live tick.
          function pop(scale) {
            if (popTimer) clearTimeout(popTimer);
            el.style.transition = 'transform 180ms cubic-bezier(.34,1.56,.64,1)';
            el.style.transform = 'scale(' + scale + ')';
            popTimer = setTimeout(function () {
              el.style.transition = 'transform 320ms cubic-bezier(.16,1,.3,1)';
              el.style.transform = 'scale(1)';
            }, 190);
          }
          function clearAll() {
            if (rollRaf) { cancelAnimationFrame(rollRaf); rollRaf = null; }
            if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
          }
          function liveTick(firstDelay) {
            tickTimer = setTimeout(function () {
              // Organic bursts: usually a trickle (+1..3), occasionally a bigger
              // rush (+5..12), rarely a single +1.
              var r = Math.random(), inc;
              if (r < 0.18) inc = 1;
              else if (r < 0.78) inc = 1 + Math.floor(Math.random() * 3);   // +1..3
              else inc = 5 + Math.floor(Math.random() * 8);                 // +5..12
              live += inc;
              el.textContent = fmt(live);
              pop(inc >= 5 ? 1.07 : 1.035);   // bigger rushes get a bigger nudge
              liveTick();
            }, firstDelay != null ? firstDelay : (900 + Math.random() * 2800)); // every ~0.9–3.7s, irregular
          }
          function rollUp() {
            clearAll();
            var dur = 1200, t0 = null;
            var ease = function (x) { return 1 - Math.pow(1 - x, 3); };
            function step(ts) {
              if (t0 === null) t0 = ts;
              var p = Math.min(1, (ts - t0) / dur);
              el.textContent = fmt(BASE * ease(p));
              if (p < 1) { rollRaf = requestAnimationFrame(step); }
              else { rollRaf = null; live = BASE; pop(1.16); liveTick(350); }
            }
            rollRaf = requestAnimationFrame(step);
          }
          function reset() { clearAll(); if (popTimer) { clearTimeout(popTimer); popTimer = null; } live = BASE; el.style.transition = 'none'; el.style.transform = 'scale(1)'; el.textContent = '0'; }
          if (REDUCE || STILL) { el.textContent = fmt(BASE); return; }
          reset();
          window.addEventListener('message', function (e) {
            var d = e.data;
            if (!d || d.source !== 'frankly-stage') return;
            if (d.type === 'enter') setTimeout(rollUp, 100);
            else if (d.type === 'reset') reset();
          });
        })();
      </script>
